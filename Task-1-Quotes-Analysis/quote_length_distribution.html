
<html>
<head>
<title>Quote Length Distribution</title>

<style>
body {
    font-family: Arial;
    margin: 20px;
}

h2 {
    text-align: center;
}

.bar-container {
    margin: 15px 0;
}

.label {
    font-size: 14px;
    margin-bottom: 4px;
}

.bar {
    height: 30px;
    background-color: #2196F3;
    color: white;
    text-align: right;
    padding-right: 8px;
    line-height: 30px;
    box-sizing: border-box;
}
</style>

</head>

<body>

<h2>Quote Length Distribution</h2>

    <div class="bar-container">
        <div class="label">0-50 characters</div>

        <div class="bar" style="width:20.833333333333336%;">
            10
        </div>
    </div>
    
    <div class="bar-container">
        <div class="label">51-100 characters</div>

        <div class="bar" style="width:100.0%;">
            48
        </div>
    </div>
    
    <div class="bar-container">
        <div class="label">101-150 characters</div>

        <div class="bar" style="width:58.333333333333336%;">
            28
        </div>
    </div>
    
    <div class="bar-container">
        <div class="label">151-200 characters</div>

        <div class="bar" style="width:4.166666666666666%;">
            2
        </div>
    </div>
    
    <div class="bar-container">
        <div class="label">201-300 characters</div>

        <div class="bar" style="width:14.583333333333334%;">
            7
        </div>
    </div>
    
    <div class="bar-container">
        <div class="label">301-500 characters</div>

        <div class="bar" style="width:4.166666666666666%;">
            2
        </div>
    </div>
    
    <div class="bar-container">
        <div class="label">501-1000 characters</div>

        <div class="bar" style="width:4.166666666666666%;">
            2
        </div>
    </div>
    
    <div class="bar-container">
        <div class="label">1001+ characters</div>

        <div class="bar" style="width:2.083333333333333%;">
            1
        </div>
    </div>
    
</body>
</html>
