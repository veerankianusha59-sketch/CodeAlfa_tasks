
<html>
<head>
<title>Top 10 Authors Bar Chart</title>

<style>
body {
    background-color: white;
    font-family: Arial;
    padding: 20px;
}

h2 {
    text-align: center;
}

.bar {
    margin: 12px 0;
}

.name {
    font-weight: bold;
    margin-bottom: 4px;
}

.bar-container {
    background-color: #eeeeee;
    width: 100%;
    height: 30px;
}

.bar-fill {
    background-color: #4285F4;
    height: 30px;
    color: white;
    text-align: right;
    padding-right: 8px;
    line-height: 30px;
}
</style>

</head>

<body>

<h2>Top 10 Authors by Number of Quotes</h2>

    <div class="bar">

        <div class="bar-container">

                10
            </div>
        </div>
    </div>
    
    <div class="bar">
        <div class="name">J.K. Rowling</div>

        <div class="bar-container">
            <div class="bar-fill" style="width:90.0%">

        </div>
    </div>
    
    <div class="bar">

        <div class="bar-container">
            <div class="bar-fill" style="width:70.0%">

        </div>
    </div>
    
    <div class="bar">

    </div>
    
    <div class="bar">
